version: '3.8'

services:
  # PostgreSQL with PostGIS Geospatial Extension
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: vega_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vega_db}
      POSTGRES_USER: ${DB_USER:-vega_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vega_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vega_user} -d ${DB_NAME:-vega_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django REST Framework Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vega_backend_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_categories &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-vega-production-secret-key-replace-in-real-deployment-2026}
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: ${DB_NAME:-vega_db}
      DB_USER: ${DB_USER:-vega_user}
      DB_PASSWORD: ${DB_PASSWORD:-vega_secure_password_2026}
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,frontend,*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vega_frontend_app
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
